
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточка товара</title>
    
    <style>
        /* Сброс лишних отступов */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        /* Видео-заставка на весь экран */
        #video-intro {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: #000;
            z-index: 9999;
            overflow: hidden;
        }
        #video-intro video {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            object-position: center center;
        }
        /* Молочный фон для основного сайта */
        #main-content {
            background-color: #f6f4ee; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            font-family: Arial, sans-serif;
            padding: 0;
        }
        /* Контейнер всей шапки (для ПК) */
        .header-container {
            width: 100%;
            padding: 20px 40px 10px 40px;
        }
        /* Строка логотипа */
        .logo-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        /* Левая часть логотипа (КАРТА) */
        .logo-left {
            font-size: 7.5vw; 
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: -3px;
            color: #1a1a1a;
            line-height: 0.8;
        }
        /* Правая часть логотипа (товара) */
        .logo-right {
            font-size: 7.5vw;
            font-weight: 300; 
            letter-spacing: -2px;
            color: #1a1a1a;
            line-height: 0.8;
            text-transform: uppercase;
        }
        /* Центральный блок с мелким текстом */
        .center-text {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        /* Вертикальный микротекст */
        .vertical-text {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            font-size: 7px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #555;
            border-left: 1px solid #ccc;
            padding-left: 4px;
        }
        /* Основной текст по центру */
        .main-subtext {
            font-size: 11px;
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: 1px;
            color: #333;
        }
        /* Курсивный текст "for experts" */
        .italic-subtext {
            font-style: italic;
            font-weight: 400;
            text-transform: lowercase;
            font-size: 14px;
            letter-spacing: 0px;
            color: #777;
        }
        
        /* Тонкие линии */
        .nav-divider {
            width: 100%;
            border: none;
            border-top: 1px solid #dcdad4;
            margin: 0 !important;
        }

        /* Бесшовная бегущая строка */
        .marquee-container {
            overflow: hidden !important;
            width: 100% !important;
            display: flex !important;
            align-items: center;
            padding: 10px 0;
        }
        
        .marquee-track {
            display: flex !important;
            align-items: center;
            justify-content: space-around;
            min-width: 100%;
            flex-shrink: 0;
            animation: scrollMarquee 35s linear infinite !important; 
        }
        
        .marquee-track img {
            height: 24px !important;
            width: auto !important;
            padding: 0 25px !important;
        }

        @keyframes scrollMarquee {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-100%);
            }
        }

        /* Контейнер для фото товара */
        .product-image-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: center;
            margin-top: 20px; 
        }
        .product-img {
            width: 100%;
            height: auto;
            object-fit: contain;
        }
        /* Класс для скрытия элементов */
        .hidden {
            display: none !important;
        }

        /* АДАПТИВ ДЛЯ МОБИЛЬНЫХ ЭКРАНОВ */
        @media (max-width: 600px) {
            .header-container {
                padding: 20px 16px 10px 16px !important; /* Уменьшаем поля, раздвигая линии во весь экран */
            }
            
            .logo-row {
                display: grid !important; /* Включаем сетку вместо одной линии */
                grid-template-columns: 1fr 1fr;
                grid-template-areas: 
                    "left right"
                    "center center";
                row-gap: 20px; /* Расстояние между надписями и мелким текстом */
                align-items: center;
            }
            
            .logo-left {
                grid-area: left;
                font-size: 11vw !important; /* Пропорционально увеличиваем под мобильный экран */
                letter-spacing: -1px;
            }
            
            .logo-right {
                grid-area: right;
                font-size: 11vw !important;
                letter-spacing: -1px;
                text-align: right;
            }
            
            .center-text {
                grid-area: center;
                justify-content: center; /* Центрируем маленький блок текста посередине */
                margin-top: 5px;
            }
        }
    </style>
</head>
<body>
    <!-- Блок с полноэкранным видео -->
    <div id="video-intro">
        <video autoplay muted playsinline preload="auto" id="myVideo">
            <source src="https://storage.yandexcloud.net/kartochkatovara/0718.mp4" type="video/mp4">
            Ваш браузер не поддерживает видео.
        </video>
    </div>

    <!-- Главный контент сайта (молочный фон) -->
    <main id="main-content" class="hidden">
        
        <!-- Шапка сайта -->
        <header class="header-container">
            <div class="logo-row">
                <span class="logo-left">КАРТА</span>
                
                <div class="center-text">
                    <div class="vertical-text">TASTE. QUALITY. AESTHETICS.</div>
                    <div class="main-subtext">
                        MARBLED BEEF MADE<br>BY EXPERTS<br>
                        <span class="italic-subtext">for experts</span>
                    </div>
                </div>
                
                <span class="logo-right">товара</span>
            </div>

            <hr class="nav-divider">

            <!-- Бегущая строка -->
            <div class="marquee-container">
                <div class="marquee-track">
                    <img src="https://storage.yandexcloud.net/kartochkatovara/Russky_3.png" alt="Logo">
                    <img src="https://storage.yandexcloud.net/kartochkatovara/Russky_3.png" alt="Logo">
                    <img src="https://storage.yandexcloud.net/kartochkatovara/Russky_3.png" alt="Logo">
                    <img src="https://storage.yandexcloud.net/kartochkatovara/Russky_3.png" alt="Logo">
                    <img src="https://storage.yandexcloud.net/kartochkatovara/Russky_3.png" alt="Logo">
                    <img src="https://storage.yandexcloud.net/kartochkatovara/Russky_3.png" alt="Logo">
                    <img src="https://storage.yandexcloud.net/kartochkatovara/Russky_3.png" alt="Logo">
                    <img src="https://storage.yandexcloud.net/kartochkatovara/Russky_3.png" alt="Logo">
                    <img src="https://storage.yandexcloud.net/kartochkatovara/Russky_3.png" alt="Logo">
                    <img src="https://storage.yandexcloud.net/kartochkatovara/Russky_3.png" alt="Logo">
                    <img src="https://storage.yandexcloud.net/kartochkatovara/Russky_3.png" alt="Logo">
                </div>
                <div class="marquee-track">
                    <img src="https://storage.yandexcloud.net/kartochkatovara/Russky_3.png" alt="Logo">
                    <img src="https://storage.yandexcloud.net/kartochkatovara/Russky_3.png" alt="Logo">
                    <img src="https://storage.yandexcloud.net/kartochkatovara/Russky_3.png" alt="Logo">
                    <img src="https://storage.yandexcloud.net/kartochkatovara/Russky_3.png" alt="Logo">
                    <img src="https://storage.yandexcloud.net/kartochkatovara/Russky_3.png" alt="Logo">
                    <img src="https://storage.yandexcloud.net/kartochkatovara/Russky_3.png" alt="Logo">
                    <img src="https://storage.yandexcloud.net/kartochkatovara/Russky_3.png" alt="Logo">
                    <img src="https://storage.yandexcloud.net/kartochkatovara/Russky_3.png" alt="Logo">
                    <img src="https://storage.yandexcloud.net/kartochkatovara/Russky_3.png" alt="Logo">
                    <img src="https://storage.yandexcloud.net/kartochkatovara/Russky_3.png" alt="Logo">
                    <img src="https://storage.yandexcloud.net/kartochkatovara/Russky_3.png" alt="Logo">
                </div>
            </div>

            <hr class="nav-divider">
        </header>

        <!-- Блок для картинки продукта -->
        <div class="product-image-container">
            <img src="https://storage.yandexcloud.net/kartochkatovara/38d2bb97-f17d-44a6-b8af-fad8173c76bd-Photoroom.png" alt="Продукт" class="product-img">
        </div>
    </main>

    <script>
    const video = document.getElementById('myVideo');
    const intro = document.getElementById('video-intro');
    const mainContent = document.getElementById('main-content');
    let isTransitioned = false;

    function showMainContent() {
        if (isTransitioned) return;
        isTransitioned = true;
        mainContent.classList.remove('hidden');
        intro.style.transition = 'opacity 0.5s ease';
        intro.style.opacity = '0';
        setTimeout(() => {
            intro.style.display = 'none';
        }, 500);
    }

    video.play().catch(function(error) {
        console.log("Автозапуск заблокирован:", error);
        showMainContent();
    });

    video.addEventListener('ended', showMainContent);
    setTimeout(showMainContent, 4000);
</script>
</body>
</html>
