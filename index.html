
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточка товара</title>
    
    <style>
        /* Сброс лишних отступов */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        /* Видео-заставка на весь экран */
        #video-intro {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: #000;
            z-index: 9999;
            overflow: hidden;
        }
        #video-intro video {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            object-position: center center;
        }
        /* Молочный фон для основного сайта */
        #main-content {
            background-color: #f6f4ee; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            font-family: Arial, sans-serif;
            padding: 0;
        }
        /* Контейнер всей шапки (для ПК) */
        .header-container {
            width: 100%;
            padding: 20px 40px 10px 40px;
        }
         /* Строка логотипа */
        .logo-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        /* Контейнер для КАРТА ТОВАРА на ПК */
        .brand-wrapper {
            display: flex;
            align-items: baseline;
            gap: 15px;
        }
        /* Левая часть логотипа (КАРТА) */
        .logo-left {
            font-size: 4.5vw; /* Уменьшили vw, так как теперь слова стоят вместе */
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: -2px;
            color: #1a1a1a;
            line-height: 0.8;
        }
        /* Правая часть логотипа (товара) */
        .logo-right {
            font-size: 4.5vw;
            font-weight: 300; 
            letter-spacing: -1px;
            color: #1a1a1a;
            line-height: 0.8;
            text-transform: uppercase;
        }
        /* Правый блок с цитатой и вертикальной чертой */
        .quote-wrapper {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            border-left: 1px solid #1a1a1a; /* Вертикальная черта на ПК */
            padding-left: 20px;
        }
        /* Текст большими буквами */
        .main-subtext {
            font-size: 13px;
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: 1px;
            color: #333;
            text-transform: uppercase; /* Автоматически делает все буквы заглавными */
        }
        /* Автор Александр Рудный под текстом */
        .italic-subtext {
            font-style: italic;
            font-weight: 400;
            font-size: 13px;
            letter-spacing: 0px;
            color: #777;
            margin-top: 4px; /* Отступ сверху, чтобы встал строго под надписью */
        }

        
        /* Тонкие линии */
        .nav-divider {
            width: 100%;
            border: none;
            border-top: 1px solid #dcdad4;
            margin: 0 !important;
        }

        /* Бесшовная бегущая строка */
        .marquee-container {
            overflow: hidden !important;
            width: 100% !important;
            display: flex !important;
            align-items: center;
            padding: 10px 0;
        }
        
        .marquee-track {
            display: flex !important;
            align-items: center;
            justify-content: space-around;
            min-width: 100%;
            flex-shrink: 0;
            animation: scrollMarquee 35s linear infinite !important; 
        }
        
        .marquee-track img {
            height: 24px !important;
            width: auto !important;
            padding: 0 25px !important;
        }

        @keyframes scrollMarquee {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-100%);
            }
        }

        /* Контейнер для фото товара */
        .product-image-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: center;
            margin-top: 20px; 
        }
        .product-img {
            width: 100%;
            height: auto;
            object-fit: contain;
        }
        /* Класс для скрытия элементов */
        .hidden {
            display: none !important;
        }

           /* АДАПТИВ ДЛЯ МОБИЛЬНЫХ ЭКРАНОВ */
        @media (max-width: 600px) {
            .header-container {
                padding: 20px 0px 10px 0px !important; /* Линии и бегущая строка во весь экран */
            }
            
            .logo-row {
                display: flex !important;
                justify-content: space-between !important;
                align-items: center !important;
                padding: 0 20px !important; /* Отступ по бокам для контента */
            }
            
            .brand-wrapper {
                display: flex !important;
                flex-direction: column !important; /* На мобилке слова встают друг под другом */
                gap: 2px !important;
            }
            
            .logo-left, .logo-right {
                font-size: 8.5vw !important; /* Крупный размер для смартфона */
                letter-spacing: -1px !important;
                text-align: left !important;
                line-height: 0.9 !important;
            }
            
            .quote-wrapper {
                border-left: 1px solid #1a1a1a !important; /* Вертикальная черта на мобилке */
                padding-left: 15px !important;
                margin-left: 15px !important;
                display: flex !important;
                flex-direction: column !important;
                align-items: flex-start !important;
            }
            
            .main-subtext {
                font-size: 11px !important; /* Чуть компактнее под узкий экран */
            }
            
            .italic-subtext {
                font-size: 11px !important;
                margin-top: 2px !important;
            }
            .marquee-container {
             padding: 5px 0 !important;
             }
             .marquee-track img {
                height: 14px !important;
                padding: 0 15px !important;
}
        }




    </style>
</head>
<body>
    <!-- Блок с полноэкранным видео -->

            Ваш браузер не поддерживает видео.
        </video>
    </div>

    <!-- Главный контент сайта (молочный фон) -->
    <main id="main-content" class="hidden">
        
        <!-- Шапка сайта -->
<header class="header-container">
    <div class="logo-row">

        <div class="brand-wrapper">

        <!-- Правая часть: Цитата и Автор через вертикальную черту -->

            <div class="italic-subtext">Александр Рудный</div>

    <hr class="nav-divider">

        <div class="marquee-track">
            <img src="https://storage.yandexcloud.net/kartochkatovara/Russky_3.png" alt="Logo">

        <div class="marquee-track">

        </div>
    </div>

    <hr class="nav-divider">
</header>


        <!-- Блок для картинки продукта -->
        <div class="product-image-container">
            <img src="https://storage.yandexcloud.net/kartochkatovara/38d2bb97-f17d-44a6-b8af-fad8173c76bd-Photoroom.png" alt="Продукт" class="product-img">
        </div>
    </main>

    <script>
    const video = document.getElementById('myVideo');
    const intro = document.getElementById('video-intro');
    const mainContent = document.getElementById('main-content');
    let isTransitioned = false;

    function showMainContent() {
        if (isTransitioned) return;
        isTransitioned = true;
        mainContent.classList.remove('hidden');
        intro.style.transition = 'opacity 0.5s ease';
        intro.style.opacity = '0';
        setTimeout(() => {
            intro.style.display = 'none';
        }, 500);
    }

    video.play().catch(function(error) {
        console.log("Автозапуск заблокирован:", error);
        showMainContent();
    });

    video.addEventListener('ended', showMainContent);
    setTimeout(showMainContent, 4000);
</script>
</body>
</html>
